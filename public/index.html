<!DOCTYPE html>
<html lang="tl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahas at Hagdan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,850&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C2E2B;--bg2:#123A34;
  --weave: rgba(217,164,65,.05);
  --paper:#F3ECD6;--paper2:#EADFC1;
  --ink:#F3ECD6;--ink-dim:#B9CCC5;
  --tile-a:#F6E9CA;--tile-b:#ECDCAF;--tile-ink:#2B2317;--tile-line:#0C2E2B;
  --gold:#E0A73C;--gold-dk:#9A6C1E;
  --snake:#B4392E;--snake-dk:#7A2118;
  --ladder:#5C8A54;--rail:#C79A55;
  --panel-bd: rgba(224,167,60,.28);
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font:16px/1.5 "Public Sans",system-ui,sans-serif;
  background:
    repeating-linear-gradient(45deg, var(--weave) 0 2px, transparent 2px 14px),
    repeating-linear-gradient(-45deg, var(--weave) 0 2px, transparent 2px 14px),
    radial-gradient(1100px 700px at 15% -10%, #164941 0%, transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
}
h1,h2,.num,.rk{font-family:"Fraunces",Georgia,serif}
main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:clamp(32px,5.4vw,52px);font-weight:850;margin:0;letter-spacing:-.02em;color:var(--paper)}
.tagline{color:var(--gold);font:600 15px/1 "Public Sans";letter-spacing:.01em}
p.lead{color:var(--ink-dim);max-width:56ch;margin:0 0 22px}

.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--panel-bd);border-radius:18px;padding:22px;box-shadow:var(--shadow)}

/* setup */
#setup{max-width:560px}
.field{margin:18px 0}
.field label{display:block;font-weight:600;margin-bottom:8px;color:var(--paper)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--panel-bd);
  background:rgba(255,255,255,.05);color:var(--paper);font-size:20px;cursor:pointer}
.stepper button:hover{background:rgba(255,255,255,.1)}
.stepper .count{font-family:"Fraunces";font-weight:700;font-size:26px;min-width:2.2ch;text-align:center}
#names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.nm-row{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.15);border:1px solid var(--panel-bd);
  border-radius:10px;padding:6px 8px}
.nm-row .swatch{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35) inset}
.nm-row input{border:0;background:transparent;color:var(--paper);font:600 14px "Public Sans";width:100%;padding:4px 2px}
.nm-row input:focus{outline:none}
.nm-row input::placeholder{color:var(--ink-dim)}

button.primary{font:700 16px "Public Sans";background:linear-gradient(180deg,var(--gold),var(--gold-dk));
  color:#241605;border:0;border-radius:12px;padding:14px 22px;cursor:pointer;box-shadow:0 6px 18px rgba(224,167,60,.25)}
button.primary:hover{filter:brightness(1.06)}
button.primary:disabled{opacity:.5;cursor:default;filter:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* game layout */
#game{display:none;grid-template-columns:minmax(0,660px) 1fr;gap:26px;align-items:start}
@media(max-width:900px){#game{grid-template-columns:1fr}}

#board-wrap{padding:14px}
#board{position:relative;display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;
  border-radius:10px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.2) inset}
.cell{position:relative;background:var(--tile-a);border:.5px solid var(--tile-line);
  display:flex;flex-direction:column;justify-content:flex-end;min-width:0;padding:2px 3px}
.cell.alt{background:var(--tile-b)}
.cell .num{position:absolute;top:2px;left:4px;font-size:9px;font-weight:650;color:var(--tile-ink);opacity:.5}
.cell.goal{background:var(--gold)}
.cell.goal .num{color:#241605;opacity:.7}
.tk{display:flex;flex-wrap:wrap;gap:1.5px;justify-content:center;align-items:flex-end;position:relative;z-index:3;padding-bottom:1px}
.tk i{width:clamp(7px,2vw,14px);aspect-ratio:1;border-radius:50%;border:1.4px solid #fffdf4;
  box-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .18s}
.tk i.now{transform:scale(1.4) translateY(-1px)}
svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* panel */
#panel h2{margin:0 0 10px;font-size:20px;font-weight:700;color:var(--paper)}
#turn{margin-bottom:16px}
#who{margin:0 0 4px;font-size:19px;color:var(--paper)}
#who .chip{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:2px;
  box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.roll-row{display:flex;align-items:center;gap:16px;margin-top:10px}
.die{width:66px;height:66px;background:var(--paper);border-radius:14px;box-shadow:0 6px 14px rgba(0,0,0,.35);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;padding:9px;flex:none}
.pip{border-radius:50%}
.pip.on{background:var(--snake-dk)}
#log{min-height:2.6em;margin:10px 0 0;font-size:14px;color:var(--ink-dim)}

#end{display:none;margin-bottom:16px;text-align:center}
#end h2{margin:0 0 6px}
#end p{color:var(--ink-dim);margin:0 0 14px}

ol#rank{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:54vh;overflow:auto}
li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.14)}
li.cur{box-shadow:0 0 0 2px var(--gold) inset}
li.done{background:rgba(224,167,60,.14)}
li .dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
li .rk{font-family:"Fraunces";font-weight:700;min-width:2.6em;color:var(--gold)}
li .pos{color:var(--ink-dim);font-size:13px;min-width:3em;text-align:right}

#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.piece{position:absolute;top:-16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){.piece{display:none}.tk i{transition:none}}
</style></head><body>
<div id="confetti"></div>
<main>
<header>
  <h1>Ahas at Hagdan</h1>
  <span class="tagline">Pasa-pasang laro · 2–18 manlalaro</span>
</header>
<p class="lead">Unang makarating sa 100 nang eksakto ang panalo. Mag-ingat sa mga ahas — at maghanap ng hagdan.</p>

<section id="setup" class="card">
  <div class="field">
    <label for="n">Bilang ng manlalaro</label>
    <div class="stepper">
      <button type="button" id="dec" aria-label="Bawasan">–</button>
      <span class="count" id="ncount">4</span>
      <button type="button" id="inc" aria-label="Dagdagan">+</button>
    </div>
  </div>
  <div class="field">
    <label>Mga pangalan</label>
    <div id="names"></div>
  </div>
  <button class="primary" id="start">Simulan ang laro</button>
</section>

<section id="game">
  <div id="board-wrap" class="card">
    <div id="board"></div>
  </div>
  <div id="panel">
    <div id="end" class="card">
      <h2>Tapos na ang laro</h2>
      <p>Nasa ibaba ang final na ranking.</p>
      <button class="primary" id="again">Laro ulit</button>
    </div>
    <div id="turn" class="card">
      <h2 id="who"></h2>
      <div class="roll-row">
        <div class="die" id="die" aria-hidden="true"></div>
        <button class="primary" id="roll">Ihagis ang dice</button>
      </div>
      <p id="log" aria-live="polite"></p>
    </div>
    <div class="card">
      <h2>Ranking</h2>
      <ol id="rank"></ol>
    </div>
  </div>
</section>
</main>
<script>
const SN={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const LD={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const $=s=>document.querySelector(s);
const PALETTE=['#E0A73C','#4E8C7C','#B4392E','#7B6FB0','#3E7CB1','#C9803C','#5C8A54','#B0568F',
  '#3F9E9A','#D46A3E','#8A6D3B','#4F73A6','#A64B6B','#6FA84B','#C4863C','#5A7EA6','#9C5EA0','#3E9268'];
let P=[],cur=0,busy=false,nPlayers=4;

function syncNameCount(){
  const wrap=$('#names');const old=[...wrap.querySelectorAll('input')].map(e=>e.value);
  wrap.innerHTML=Array.from({length:nPlayers},(_,i)=>
    `<div class="nm-row"><span class="swatch" style="background:${PALETTE[i%PALETTE.length]}"></span>
     <input aria-label="Pangalan ng player ${i+1}" maxlength="14" placeholder="Player ${i+1}" value="${old[i]||''}"></div>`).join('');
}
$('#dec').onclick=()=>{nPlayers=Math.max(2,nPlayers-1);$('#ncount').textContent=nPlayers;syncNameCount();};
$('#inc').onclick=()=>{nPlayers=Math.min(18,nPlayers+1);$('#ncount').textContent=nPlayers;syncNameCount();};
syncNameCount();

const xy=n=>{const i=n-1,r=Math.floor(i/10),c=r%2?9-i%10:i%10;return[c*10+5,(9-r)*10+5]};

function wavePath(x1,y1,x2,y2,segs=5,amp=2.6){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,px=-uy,py=ux;
  let d=`M${x1} ${y1}`;
  for(let i=1;i<=segs;i++){
    const t=i/segs,bx=x1+dx*t,by=y1+dy*t,sign=i%2?1:-1;
    const ct=(i-0.5)/segs,cbx=x1+dx*ct,cby=y1+dy*ct;
    d+=` Q${(cbx+px*amp*sign).toFixed(2)} ${(cby+py*amp*sign).toFixed(2)} ${bx.toFixed(2)} ${by.toFixed(2)}`;
  }
  return d;
}

function snakeSVG(a,b){
  const [x1,y1]=xy(a),[x2,y2]=xy(b);
  const path=wavePath(x1,y1,x2,y2,5,2.4);
  const dx=x1-x2,dy=y1-y2,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len; // direction away from body at head
  const tx1=x1+ux*2.6, ty1=y1+uy*2.6;
  const tx2=x1+ux*3.6+(-uy)*.8, ty2=y1+uy*3.6+ux*.8;
  const tx3=x1+ux*3.6-(-uy)*.8, ty3=y1+uy*3.6-ux*.8;
  return `<g>
    <path d="${path}" fill="none" stroke="var(--snake-dk)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="${path}" fill="none" stroke="var(--snake)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="${path}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".6" stroke-dasharray="1.4 1.6" stroke-linecap="round"/>
    <line x1="${x1}" y1="${y1}" x2="${tx1}" y2="${ty1}" stroke="var(--snake)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#8B1E17" stroke-width=".6" stroke-linecap="round"/>
    <line x1="${tx1}" y1="${ty1}" x2="${tx3}" y2="${ty3}" stroke="#8B1E17" stroke-width=".6" stroke-linecap="round"/>
    <circle cx="${x1}" cy="${y1}" r="2.5" fill="var(--snake-dk)"/>
    <circle cx="${x1-.7}" cy="${y1-.6}" r=".5" fill="#fff"/>
    <circle cx="${x1+.9}" cy="${y1-.6}" r=".5" fill="#fff"/>
  </g>`;
}

function ladderSVG(a,b){
  const [x1,y1]=xy(a),[x2,y2]=xy(b);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,px=-uy,py=ux,off=1.5;
  const r1=[[x1+px*off,y1+py*off],[x2+px*off,y2+py*off]];
  const r2=[[x1-px*off,y1-py*off],[x2-px*off,y2-py*off]];
  const rungs=Math.max(4,Math.round(len/7));
  let rungHTML='';
  for(let i=0;i<=rungs;i++){
    const t=i/rungs,cx=x1+dx*t,cy=y1+dy*t;
    rungHTML+=`<line x1="${cx+px*off}" y1="${cy+py*off}" x2="${cx-px*off}" y2="${cy-py*off}" stroke="var(--ladder)" stroke-width="1"/>`;
  }
  return `<g>
    <line x1="${r1[0][0]}" y1="${r1[0][1]}" x2="${r1[1][0]}" y2="${r1[1][1]}" stroke="var(--rail)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="${r2[0][0]}" y1="${r2[0][1]}" x2="${r2[1][0]}" y2="${r2[1][1]}" stroke="var(--rail)" stroke-width="1.3" stroke-linecap="round"/>
    ${rungHTML}
  </g>`;
}

function buildBoard(){
  let h='';
  for(let r=9;r>=0;r--)for(let c=0;c<10;c++){
    const n=r%2?r*10+(10-c):r*10+c+1;
    h+=`<div class="cell${(r+c)%2?' alt':''}${n===100?' goal':''}" id="c${n}"><span class="num">${n}</span><div class="tk"></div></div>`;
  }
  let s='<svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none">';
  for(const[a,b]of Object.entries(LD)) s+=ladderSVG(+a,b);
  for(const[a,b]of Object.entries(SN)) s+=snakeSVG(+a,b);
  $('#board').innerHTML=h+s+'</svg>';
}

function placeTokens(){
  document.querySelectorAll('.tk').forEach(t=>t.innerHTML='');
  P.forEach((p,i)=>{if(p.pos<1)return;
    const t=document.querySelector(`#c${p.pos} .tk`);
    t.insertAdjacentHTML('beforeend',`<i class="${i===cur&&!p.rank?'now':''}" title="${p.name}" style="background:${p.color}"></i>`);});
}

const MEDAL={1:'🥇 ',2:'🥈 ',3:'🥉 '};
function renderRank(){
  const order=[...P].sort((a,b)=>a.rank&&b.rank?a.rank-b.rank:a.rank?-1:b.rank?1:b.pos-a.pos);
  $('#rank').innerHTML=order.map(p=>`<li class="${p.rank?'done':''}${P[cur]===p&&!p.rank?' cur':''}">
    <span class="rk">${p.rank?(MEDAL[p.rank]||'#'+p.rank):'—'}</span>
    <span class="dot" style="background:${p.color}"></span>
    <span class="nm">${p.name}</span>
    <span class="pos">${p.pos<1?'Start':'petsa '+p.pos}</span></li>`).join('');
  $('#who').innerHTML=P[cur]?`<span class="chip" style="background:${P[cur].color}"></span>Turn ni ${P[cur].name}`:'';
}
function refresh(){placeTokens();renderRank()}

const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHTML(v){
  let h='';
  for(let i=0;i<9;i++)h+=`<span class="pip${PIP[v].includes(i)?' on':''}"></span>`;
  return h;
}
$('#die').innerHTML=dieHTML(1);

function burstConfetti(color){
  const box=$('#confetti');
  for(let i=0;i<70;i++){
    const p=document.createElement('div');
    p.className='piece';
    const c=[color,'#E0A73C','#4E8C7C','#B4392E','#F3ECD6'][Math.floor(Math.random()*5)];
    p.style.background=c;
    p.style.left=Math.random()*100+'vw';
    p.style.width=p.style.height=(4+Math.random()*5)+'px';
    const dur=(2.2+Math.random()*1.6).toFixed(2);
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    box.appendChild(p);
    setTimeout(()=>p.remove(),(parseFloat(dur)+1)*1000);
  }
}

function nextPlayer(){
  const left=P.filter(p=>!p.rank);
  if(left.length<=1){
    if(left.length===1)left[0].rank=P.length;
    $('#end').style.display='block';$('#turn').style.display='none';refresh();
    const champ=P.find(p=>p.rank===1);if(champ)burstConfetti(champ.color);
    return;
  }
  do{cur=(cur+1)%P.length}while(P[cur].rank);
  busy=false;$('#roll').disabled=false;refresh();
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function roll(){
  if(busy)return;busy=true;$('#roll').disabled=true;
  const p=P[cur];
  for(let i=0;i<8;i++){$('#die').innerHTML=dieHTML(1+Math.floor(Math.random()*6));await sleep(60)}
  const d=1+Math.floor(Math.random()*6);$('#die').innerHTML=dieHTML(d);
  let msg=`${p.name} ay nakakuha ng ${d}.`;
  if(p.pos+d>100){
    msg+=' Kailangan ng eksaktong bilang para sa 100, kaya hindi gumalaw.';
  }else{
    for(let i=0;i<d;i++){p.pos++;refresh();await sleep(140)}
    if(LD[p.pos]){msg+=` Hagdan! Akyat sa ${LD[p.pos]}.`;p.pos=LD[p.pos];}
    else if(SN[p.pos]){msg+=` Ahas! Bagsak sa ${SN[p.pos]}.`;p.pos=SN[p.pos];}
    if(p.pos===100){p.rank=P.filter(x=>x.rank).length+1;msg+=` Nakarating sa 100! Rank ${p.rank}.`;}
  }
  $('#log').textContent=msg;refresh();await sleep(650);nextPlayer();
}

function start(){
  const inputs=[...document.querySelectorAll('#names input')];
  P=inputs.map((e,i)=>({name:e.value.trim()||`Player ${i+1}`,color:PALETTE[i%PALETTE.length],pos:0,rank:0}));
  cur=0;busy=false;
  $('#setup').style.display='none';$('#game').style.display='grid';
  $('#end').style.display='none';$('#turn').style.display='block';
  $('#log').textContent='';$('#die').innerHTML=dieHTML(1);$('#roll').disabled=false;
  buildBoard();refresh();
}
$('#start').onclick=start;$('#roll').onclick=roll;
$('#again').onclick=()=>{$('#game').style.display='none';$('#setup').style.display='block'};
</script></body></html>
